# amplify.yml
# AWS Amplify build configuration for Astro with @astrojs/node (standalone SSR)
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node --version
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # The node adapter outputs a standalone server in dist/
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
